<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Precios de gasolineras actualizados, puntos de carga para coches eléctricos e híbridos y parkings de toda España.">
  <!-- Brave con modo oscuro forzado hacía visibles los placeholders ocultos de Flutter (lección de Deepslate). -->
  <meta name="color-scheme" content="dark light">
  <!--
    CSP: si se añade un servicio externo (otro proveedor de mapas, analítica...), añadirlo aquí.
    - wasm-unsafe-eval: CanvasKit
    - tile.openstreetmap.org: teselas del mapa (PROVISIONAL, ver config.dart)
    - *.supabase.co: datos, sesión y fotos
    - accounts.google.com / appleid.apple.com no hacen falta: el login va por redirección, no en un marco
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://tile.openstreetmap.org https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">

  <meta property="og:title" content="Tinerfuel">
  <meta property="og:description" content="Gasolineras más baratas, cargadores eléctricos y parkings de toda España.">
  <meta property="og:type" content="website">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tinerfuel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tinerfuel · Gasolineras, cargadores y parkings de España</title>
  <link rel="manifest" href="manifest.json">
  <style>
    ::placeholder { color: transparent; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    body { margin: 0; background: #F6FBF8; }
    @media (prefers-color-scheme: dark) { body { background: #101413; } }
  </style>
</head>
<body>
  <h1 class="sr-only">Tinerfuel: precios de gasolineras, cargadores eléctricos y parkings de España</h1>
  <noscript>Tinerfuel necesita JavaScript para mostrar el mapa.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
