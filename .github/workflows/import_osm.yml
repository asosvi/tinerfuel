name: Importar parkings (OpenStreetMap)

# Los parkings cambian poco: una vez al mes. Overpass es un servidor público
# y gratuito: no subir la frecuencia.
on:
  schedule:
    - cron: "0 3 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-osm
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Importar
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: python -I importer/osm.py
      - name: Sin secretos
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "Faltan los secretos SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY. No se importa nada."
