name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Tests de los importadores (Python)
        run: python -I -m unittest discover -s importer/tests

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests del parser del MITECO (Edge Function)
        run: node --test supabase/functions/import-fuel/parse.test.ts

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Flutter analyze + test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
